# Home-lab only: build the welle-cli image from this fork and push it to GHCR.
# Excluded via .git/info/exclude and force-added on `homelab` so it never lands
# on an upstream-PR branch. The image is pure GPL welle.io (no private config).
name: Build welle-cli image

on:
  push:
    branches: [homelab]
    paths:
      - 'Dockerfile.welle-cli'
      - '.github/workflows/welle-cli-image.yml'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history + tags so welle's `git describe` version is correct

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.welle-cli
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/welle-cli:homelab
            ghcr.io/${{ github.repository_owner }}/welle-cli:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
